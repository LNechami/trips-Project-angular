<div class="login-wrapper">
  <div class="login-card">
    <h2>Connecting to the travel system</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmitForm()">
      
      <div class="form-group">
        <label for="username">User name: </label>
        <input id="username" type="text" formControlName="username" placeholder="Enter username"/>
        
        @if (username.invalid && username.touched) {
          <div class="error-message">Username field is required.</div>
        }
      </div>
      
      <div class="form-group">
        <label for="password">Password:</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter password"/>
        
        @if (password.invalid && password.touched) {
          <div class="error-message">Password field is required.</div>
        }
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Connect</button>

      <div class="register-link">
        <span>Don't have an account?</span>
        <a routerLink="/register" >Register here</a>
      </div>

    </form>
  </div>
</div>
